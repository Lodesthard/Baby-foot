<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Baby-Foot Ranked</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== Login Screen ===== -->
    <div id="login-screen" class="login-page">
        <div class="login-logo">Baby-Foot</div>
        <div class="login-subtitle">Ranked</div>

        <div class="login-box" id="login-form">
            <h2>Connexion</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Identifiant</label>
                    <input type="text" id="login-id" placeholder="Votre identifiant" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="login-pass" placeholder="Mot de passe" required autocomplete="current-password">
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="btn">Se connecter</button>
            </form>
            <button class="link-btn" onclick="toggleLoginRegister()">Pas de compte ? S'inscrire</button>
        </div>

        <div class="login-box" id="register-form" style="display:none">
            <h2>Inscription</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Identifiant</label>
                    <input type="text" id="reg-id" placeholder="Choisir un identifiant" required>
                </div>
                <div class="form-group">
                    <label>Nom d'affichage</label>
                    <input type="text" id="reg-name" placeholder="Votre pseudo" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="reg-pass" placeholder="Mot de passe" required>
                </div>
                <div id="reg-error" class="error-msg"></div>
                <button type="submit" class="btn">Creer mon compte</button>
            </form>
            <button class="link-btn" onclick="toggleLoginRegister()">Deja un compte ? Se connecter</button>
        </div>
    </div>

    <!-- ===== App ===== -->
    <div id="app-main" style="display:none">
        <div class="header">
            <h1>Baby-Foot Ranked</h1>
            <span class="header-user" id="header-user"></span>
        </div>

        <nav class="nav-bar">
            <button data-page="home" onclick="navigate('home')">Accueil</button>
            <button data-page="match" onclick="navigate('match')">Match</button>
            <button data-page="rankings" onclick="navigate('rankings')">Classement</button>
            <button data-page="tournaments" onclick="navigate('tournaments')">Tournois</button>
            <button data-page="history" onclick="navigate('history')">Historique</button>
            <button data-page="rules" onclick="navigate('rules')">Reglement</button>
            <button data-page="profile" onclick="navigate('profile')">Profil</button>
            <button data-page="admin" onclick="navigate('admin')">Admin</button>
        </nav>

        <!-- Pages -->
        <div id="page-home" class="page active">
            <div id="home-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-match" class="page">
            <div id="match-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-rankings" class="page">
            <div id="ranking-tabs" class="ranking-tabs"></div>
            <input type="text" class="search-input" id="ranking-search"
                placeholder="Rechercher un joueur..." oninput="filterRankings(this.value)">
            <div id="ranking-list"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-tournaments" class="page">
            <div id="tournaments-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-history" class="page">
            <div id="history-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-rules" class="page">
            <div id="rules-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-profile" class="page">
            <div id="profile-content"><div class="loading">Chargement...</div></div>
        </div>

        <div id="page-admin" class="page">
            <div id="admin-content"><div class="loading">Chargement...</div></div>
        </div>

        <!-- Player profile overlay -->
        <div id="player-profile-overlay" class="elo-result-overlay" style="display:none">
            <div class="elo-result-box" style="max-width:500px;text-align:left" id="player-profile-box">
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
