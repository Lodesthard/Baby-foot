name: CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -az --delete \
            --filter='protect .env' \
            --filter='protect node_modules' \
            ./frontend ./database ./backend \
            root@${{ secrets.SERVER_IP }}:/opt/Baby-foot/

      - name: Restart app
        run: |
          ssh root@${{ secrets.SERVER_IP }} "pm2 reload babyfoot --update-env"
